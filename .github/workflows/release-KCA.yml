name: Export KCA theme to standalone repo & Release (Git Updater)

on:
  push:
    tags:
      - 'kca-*'
      - 'kca-v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  SRC_DIR: themes/krishna-consciousness-academy
  TARGET_REPO: pavel-pasechnik/krishna-consciousness-academy

jobs:
  export-and-release:
    runs-on: ubuntu-latest
    env:
      GH_PAT: ${{ secrets.TARGET_REPO_TOKEN }}

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate PAT availability
        run: |
          if [ -z "${GH_PAT}" ]; then
            echo "Error: TARGET_REPO_TOKEN is not available"; exit 1
          else
            echo "GH_PAT is present (masked)"
          fi

      - name: Get tag & repo meta
        id: meta
        run: |
          echo "TAG_NAME=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_OUTPUT

      - name: Read Version from style.css and match with tag
        id: version
        run: |
          FILE="$SRC_DIR/style.css"
          if [ ! -f "$FILE" ]; then
            echo "style.css not found in $SRC_DIR"; exit 1
          fi
          THEME_VERSION=$(grep -i '^Version:' "$FILE" | cut -d ':' -f 2 | xargs)
          if [ -z "$THEME_VERSION" ]; then
            echo "Failed to read Version: from $FILE"; exit 1
          fi
          TAG="${{ steps.meta.outputs.TAG_NAME }}"
          # поддерживаем теги вида kca-1.2.3 и кca-v1.2.3
          TAG_NOPREFIX="${TAG#kca-}"
          TAG_STRIPPED="${TAG_NOPREFIX#v}"
          echo "style.css Version: $THEME_VERSION"
          echo "Tag: $TAG / Target tag: $TAG_STRIPPED"
          if [ "$THEME_VERSION" != "$TAG_STRIPPED" ]; then
            echo "Version in style.css ($THEME_VERSION) must equal stripped tag ($TAG_STRIPPED)"; exit 1
          fi
          echo "THEME_VERSION=$THEME_VERSION" >> $GITHUB_OUTPUT
          echo "TAG_TARGET=$TAG_STRIPPED" >> $GITHUB_OUTPUT

      - name: Prepare export folder & zip
        id: pack
        run: |
          set -e
          TAG="${{ steps.version.outputs.TAG_TARGET }}"
          REPO_SLUG="${TARGET_REPO##*/}"

          mkdir -p dist
          TMP_DIR=$(mktemp -d)

          # Copy only the theme subdir
          rsync -a "$SRC_DIR/" "$TMP_DIR/$REPO_SLUG/" --delete --exclude ".git" --exclude "node_modules" || true

          # Ensure style.css exists in the exported root
          test -f "$TMP_DIR/$REPO_SLUG/style.css"

          ZIP_PATH="dist/${REPO_SLUG}-${TAG}.zip"
          (cd "$TMP_DIR" && zip -r -q "$GITHUB_WORKSPACE/$ZIP_PATH" "$REPO_SLUG")

          echo "zip_path=$ZIP_PATH" >> $GITHUB_OUTPUT
          echo "zip_name=$(basename "$ZIP_PATH")" >> $GITHUB_OUTPUT
          echo "tmp_dir=$TMP_DIR" >> $GITHUB_OUTPUT

      - name: Checkout target repo (with PAT)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ env.GH_PAT }}
          path: target
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Sync files to target repo
        run: |
          set -e
          TARGET_DIR="$GITHUB_WORKSPACE/target"

          # Sanity: show where we are and where the target repo lives
          echo "ROOT: $(pwd)" && ls -la
          echo "TARGET_DIR: $TARGET_DIR" && ls -la "$TARGET_DIR"

          # Ensure target repo is exactly at latest origin/main
          git -C "$TARGET_DIR" remote -v
          git -C "$TARGET_DIR" fetch origin main --prune
          git -C "$TARGET_DIR" checkout -B main || true
          git -C "$TARGET_DIR" reset --hard origin/main || true

          # Force origin to PAT URL and show remotes
          git -C "$TARGET_DIR" remote set-url origin "https://x-access-token:${GH_PAT}@github.com/${TARGET_REPO}.git"
          git -C "$TARGET_DIR" remote -v

          REPO_SLUG="${TARGET_REPO##*/}"
          rsync -a --delete "${{ steps.pack.outputs.tmp_dir }}/$REPO_SLUG/" "$TARGET_DIR/"

          DEMO_SRC="demo/${REPO_SLUG}"
          if [ -d "$DEMO_SRC" ]; then
            rsync -a --delete "$DEMO_SRC/" "$TARGET_DIR/"
          else
            echo "No demo folder at $DEMO_SRC (skip)"
          fi

          git -C "$TARGET_DIR" config user.name "github-actions[bot]"
          git -C "$TARGET_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git -C "$TARGET_DIR" status --porcelain)" ]; then
            git -C "$TARGET_DIR" add -A
            git -C "$TARGET_DIR" commit -m "Export from monorepo ${GITHUB_REPOSITORY}@${GITHUB_SHA} (tag ${{ steps.meta.outputs.TAG_NAME }} → ${{ steps.version.outputs.TAG_TARGET }})"
            git -C "$TARGET_DIR" push --force "https://x-access-token:${GH_PAT}@github.com/${TARGET_REPO}.git" HEAD:main
          else
            echo "No changes to commit"
          fi

      - name: Store latest release archive in repo
        run: |
          set -e
          TARGET_DIR="$GITHUB_WORKSPACE/target"
          mkdir -p "$TARGET_DIR/releases"
          ZIP="$GITHUB_WORKSPACE/${{ steps.pack.outputs.zip_path }}"

          # Skip committing too-large archives (>95MB) — keep only in GitHub Release
          BYTES=$(stat -c%s "$ZIP" 2>/dev/null || wc -c < "$ZIP")
          if [ "$BYTES" -gt 99500000 ]; then
            echo "Archive >95MB; skip committing to repo (kept in GitHub Release only)."
            exit 0
          fi

          # Remove existing zips to avoid repo bloat
          find "$TARGET_DIR/releases" -maxdepth 1 -type f -name '*.zip' -print -delete || true

          REPO_SLUG="${TARGET_REPO##*/}"
          TAG="${{ steps.version.outputs.TAG_TARGET }}"
          cp "$ZIP" "$TARGET_DIR/releases/${REPO_SLUG}-${TAG}.zip"
          cp "$ZIP" "$TARGET_DIR/releases/${REPO_SLUG}-latest.zip"

          git -C "$TARGET_DIR" add releases/
          if [ -n "$(git -C "$TARGET_DIR" status --porcelain)" ]; then
            git -C "$TARGET_DIR" commit -m "chore(releases): update archive for ${TAG}"
            git -C "$TARGET_DIR" push --force "https://x-access-token:${GH_PAT}@github.com/${TARGET_REPO}.git" HEAD:main
          else
            echo "No changes to commit in releases/"
          fi

      - name: Tag target repo
        run: |
          set -e
          TARGET_DIR="$GITHUB_WORKSPACE/target"
          git -C "$TARGET_DIR" fetch --tags
          TAG="${{ steps.version.outputs.TAG_TARGET }}"
          if git -C "$TARGET_DIR" rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists in target repo. Skipping tag creation."
          else
            git -C "$TARGET_DIR" tag "$TAG"
            git -C "$TARGET_DIR" push "https://x-access-token:${GH_PAT}@github.com/${TARGET_REPO}.git" "$TAG"
          fi

      - name: Create Release on target repo and upload ZIP
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ env.GH_PAT }}
          repository: ${{ env.TARGET_REPO }}
          tag_name: ${{ steps.version.outputs.TAG_TARGET }}
          name: ${{ steps.version.outputs.TAG_TARGET }}
          body: |
            Automated release exported from ${{ steps.meta.outputs.REPO_NAME }} (monorepo)
            - Theme version: ${{ steps.version.outputs.THEME_VERSION }}
            - Asset: ${{ steps.pack.outputs.zip_name }}
          draft: false
          prerelease: false
          files: |
            ${{ steps.pack.outputs.zip_path }}
          fail_on_unmatched_files: true
